services:
  valheim-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    # Mount persistent data so worlds survive container restarts
    volumes:
      - valheim-server:/home/valheim/server
      - valheim-worlds:/home/valheim/worlds
      - valheim-backups:/home/valheim-backups
    # Expose Valheim game ports (UDP 2456-2457)
    ports:
      - "2456:2456/udp"
      - "2457:2457/udp"
    # Run as valheim user
    user: valheim
    # Keep container running
    tty: true
    stdin_open: true
    environment:
      - SERVER_NAME=My Valheim Server
      - WORLD_NAME=val-one-dot-oh
      - GAME_PORT=2456
      - STEAM_APP_ID=896660
    command: ["bash", "-c", "valheimctl install && valheimctl start && while true; do sleep 1; done"]

volumes:
  valheim-server:
  valheim-worlds:
  valheim-backups:
