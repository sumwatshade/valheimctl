services:
  valheimctl:
    build:
      context: .
      dockerfile: Dockerfile
    # Mount the source so edits on the host are reflected in the container
    volumes:
      - .:/home/valheim/valheimctl:cached
    # Run as valheim user (has sudo)
    user: valheim
    # Keep container running for interactive testing
    tty: true
    stdin_open: true
    command: ["bash"]
